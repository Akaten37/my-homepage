<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ごらてにあ | TRPG向け立ち絵素材</title>
  <meta name="description" content="複数のクリエイターによるTRPG向け素材ショップ「ごらてにあ」の立ち絵紹介サイトです。">
  <link rel="stylesheet" href="style.css">
  <link rel="preload" as="image" href="img/ごらてにあ_キャッチコピー.png">
  <script>
    // オープニングは、サイトを開いて最初の1回だけ見せる(詳細ページから戻ったときなどは出さない)
    try {
      if (sessionStorage.getItem("opening-shown")) {
        document.documentElement.classList.add("no-opening");
      } else {
        sessionStorage.setItem("opening-shown", "1");
      }
    } catch (error) {
      // 保存できない環境では毎回オープニングを出す
    }
  </script>
</head>
<body>

  <!-- オープニング:キャッチコピーを画面いっぱいに出してから、サイトに切り替わる -->
  <div class="opening" aria-hidden="true">
    <img class="opening__image" id="opening-image" src="img/ごらてにあ_キャッチコピー.png" alt="" width="2032" height="774">
  </div>
  <script>
    // キャッチコピーの画像を読み込み終えてから演出を始める(読み込めなくても3秒で始める)
    (function () {
      const image = document.getElementById("opening-image");
      const start = () => document.documentElement.classList.add("opening-ready");
      if (image.complete) {
        start();
      } else {
        image.addEventListener("load", start);
        image.addEventListener("error", start);
        setTimeout(start, 3000);
      }
    })();
  </script>

  <header class="header">
    <div class="header__inner">
      <a class="header__logo" href="index.html">
        <img class="header__logo-image" src="img/ごらてにあ_Logo_白_1200×1200.png" alt="" width="36" height="36">
        <span class="header__logo-text">ごらてにあ</span>
      </a>
      <nav class="nav" aria-label="メインメニュー">
        <ul class="nav__list">
          <li class="nav__item"><a class="nav__link" href="index.html#items">立ち絵一覧</a></li>
          <li class="nav__item"><a class="nav__link" href="index.html#creators">クリエイター</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>

    <section class="hero">
      <div class="hero__inner">

        <!-- 左側:キャッチコピーと説明 -->
        <div class="hero__content">
          <p class="hero__lead">TRPG・ゲーム・創作に使える</p>
          <h1 class="hero__title">
            <img class="hero__title-image" src="img/ごらてにあ_キャッチコピー.png" alt="卓を彩る立ち絵素材を" width="2032" height="774">
          </h1>
          <p class="hero__text">
            「ごらてにあ」は、複数のクリエイターによるTRPG向け素材のショップです。<br>
            このサイトでは、BOOTHで販売中の立ち絵を紹介しています。
          </p>
          <a class="button button--large" href="https://goratenia.booth.pm/" target="_blank" rel="noopener noreferrer"><span data-icon="shopping_cart"></span><span>BOOTHで素材を見る</span><span data-icon="arrow_forward"></span></a>
          <ul class="hero__features">
            <li class="hero__feature"><span data-icon="edit"></span><span>立ち絵素材</span></li>
            <li class="hero__feature"><span data-icon="sentiment_satisfied"></span><span>表情差分</span></li>
            <li class="hero__feature"><span data-icon="folder"></span><span>豊富なバリエーション</span></li>
          </ul>
        </div>

        <!-- 右側:メインイラスト(飾りなので読み上げない) -->
        <div class="hero__visual" aria-hidden="true">
          <img class="hero__illust" src="img/メインビジュアル_キャラまとめ.png" alt="" width="1356" height="1080">
          <img class="hero__hand" src="img/ごらてにあ_手書き英字.png" alt="" width="185" height="145">
          <span class="hero__deco hero__deco--1"></span>
          <span class="hero__deco hero__deco--2"></span>
          <span class="hero__deco hero__deco--3"></span>
          <span class="hero__deco hero__deco--4"></span>
        </div>

      </div>
    </section>

    <section class="section" id="items">
      <div class="section__inner">
        <h2 class="section__title">立ち絵一覧</h2>
        <!-- タグのボタンと商品カードは script.js が items.js から自動で作ります -->
        <div class="filter" id="filter" role="group" aria-label="タグで絞り込む"></div>
        <div class="item-list" id="item-list"></div>
      </div>
    </section>

    <section class="section section--alt" id="creators">
      <div class="section__inner">
        <h2 class="section__title">クリエイター</h2>
        <ul class="creator-list" id="creator-list"></ul>
      </div>
    </section>

    <section class="section" id="shop">
      <div class="section__inner section__inner--narrow">
        <h2 class="section__title">ショップについて</h2>
        <p class="section__text">
          購入は、BOOTHの「ごらてにあ」から行えます。更新頻度は不定期です。
        </p>
        <a class="button" href="https://goratenia.booth.pm/" target="_blank" rel="noopener noreferrer"><span>BOOTHのショップへ</span><span data-icon="open_in_new"></span></a>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p class="footer__text">&copy; ごらてにあ</p>
  </footer>

  <script src="items.js"></script>
  <script src="script.js"></script>
</body>
</html>
